# Local lab: Cowrie + PostgreSQL on this machine only.
# Everything binds to 127.0.0.1, so nothing here is reachable from the network.
# The real internet-facing sensor is set up separately (see docs/scope.md).

name: honeypot-lab

services:
  postgres:
    # Pinned by digest (PostgreSQL 17.11): builds are reproducible and a
    # re-tagged upstream image can't slip in unnoticed.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is empty (first start).
      - ./collector/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cowrie:
    # Pinned by digest (Cowrie 3.0.15, the same release the sensor installs).
    image: cowrie/cowrie@sha256:fc57120d88c2bfb5817f63f6c132ce5c2969b641c2f1ac67887652b6f294148d
    environment:
      # Cowrie reads COWRIE_<SECTION>_<OPTION> as config overrides.
      # Lab values only; the real sensor's values stay out of the public repo.
      COWRIE_HONEYPOT_HOSTNAME: ${COWRIE_HOSTNAME:-lab-sensor}
      COWRIE_SSH_FORWARDING: "false"
      COWRIE_TELNET_ENABLED: "false"
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      - ./var/cowrie:/cowrie/cowrie-git/var/log/cowrie
    restart: unless-stopped

volumes:
  pgdata:
